[package]
name = "vise-mods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
description = "Vise's mod files: content mods, modpacks and the registry index (docs/mods.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
wasmparser = { version = "0.254", optional = true }
sha2 = { version = "0.10", optional = true }
minisign-verify = { version = "0.3", optional = true }
vise-shader-api = { path = "../vise-shader-api", optional = true }

[features]
index = ["dep:sha2", "dep:minisign-verify", "dep:vise-shader-api", "dep:wasmparser"]

[lints]
workspace = true
