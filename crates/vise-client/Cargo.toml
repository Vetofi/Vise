[package]
name = "vise-client"
default-run = "vise-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Vise native development client"

[dependencies]
vise-assets = { path = "../vise-assets" }
vise-client-core = { path = "../vise-client-core" }
vise-client-input = { path = "../vise-client-input" }
vise-client-render = { path = "../vise-client-render" }
vise-command = { path = "../vise-command" }
vise-items = { path = "../vise-items" }
vise-core = { path = "../vise-core" }
vise-threads = { path = "../vise-threads" }
vise-hdr = { path = "../vise-hdr" }
vise-world = { path = "../vise-world" }
vise-protocol = { path = "../vise-protocol" }
vise-server-files = { path = "../vise-server-files" }
vise-anticheat = { path = "../vise-anticheat" }
vise-shaders = { path = "../vise-shaders" }
vise-shader-api = { path = "../vise-shader-api" }
vise-friends = { path = "../vise-friends" }
vise-api = { path = "../vise-api" }
vise-mods = { path = "../vise-mods", default-features = false, features = ["index"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
miniz_oxide = "0.8"
ab_glyph = "0.2.32"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
vise-theme = { path = "../vise-theme" }
vise-telemetry = { path = "../vise-telemetry", default-features = false, features = ["live"] }
vise-bench = { path = "../vise-bench" }
zip = { version = "2", default-features = false, features = ["deflate"] }
gilrs = { version = "0.11", optional = true }
vise-dualsense = { path = "../vise-dualsense", optional = true }
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-bidi = "0.3.18"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time", "process"] }

[target.'cfg(windows)'.dependencies]
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["audio", "controllers"]
audio = ["vise-client-render/audio"]
controllers = ["dep:gilrs", "dep:vise-dualsense", "vise-client-input/controllers"]
rng-trace = ["vise-core/rng-trace"]

[[example]]
name = "client_probe"
path = "examples/probe/main.rs"

[lints]
workspace = true

[dev-dependencies]
vise-client-render = { path = "../vise-client-render", features = ["test-support"] }
vise-items = { path = "../vise-items", features = ["test-support"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }
