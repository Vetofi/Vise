[package]
name = "vise-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vise's Minecraft Java Edition 26.3 network protocol (version 777)"

[dependencies]
vise-core = { path = "../vise-core" }
vise-world = { path = "../vise-world" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
serde_json = "1.0.151"
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3.4"

[[example]]
name = "protocol_probe"
path = "examples/probe.rs"

[[example]]
name = "item_wire_probe"
path = "examples/item_wire_probe.rs"

[lints]
workspace = true
