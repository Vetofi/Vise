[package]
name = "vise-shader-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Vise's own shader packs (WGSL, docs/shaders.md): the format, the stages, the check, and the vise-shader tool"

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
