[package]
name = "vise-client-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's world data, rendering and screens: chunks, meshing, light, streaming, the renderer, the HUD, menus and settings; no gameplay"

[dependencies]
vise-assets = { path = "../vise-assets" }
vise-bench = { path = "../vise-bench" }
vise-client-core = { path = "../vise-client-core" }
vise-client-input = { path = "../vise-client-input" }
vise-command = { path = "../vise-command" }
vise-core = { path = "../vise-core" }
vise-hdr = { path = "../vise-hdr" }
vise-items = { path = "../vise-items" }
vise-protocol = { path = "../vise-protocol" }
vise-shader-api = { path = "../vise-shader-api" }
vise-shaders = { path = "../vise-shaders" }
vise-telemetry = { path = "../vise-telemetry", default-features = false, features = ["live"] }
vise-theme = { path = "../vise-theme" }
vise-threads = { path = "../vise-threads" }
vise-world = { path = "../vise-world" }
ab_glyph = "0.2.32"
bytemuck = { version = "1.24", features = ["derive"] }
cpal = { version = "0.16", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
glam = "0.30"
log = "0.4"
miniz_oxide = "0.8"
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
png = "0.18"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
unicode-bidi = "0.3.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
audio = ["dep:cpal"]
test-support = []

[lints]
workspace = true

[dev-dependencies]
vise-items = { path = "../vise-items", features = ["test-support"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }
