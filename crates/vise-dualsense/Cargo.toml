[package]
name = "vise-dualsense"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "The DualSense's output over HID: rumble, adaptive triggers, lightbar and player LEDs"

[dependencies]
log = "0.4"

[target.'cfg(not(target_os = "ios"))'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw", "macos-shared-device"] }
cpal = "0.16"

[lints]
workspace = true
