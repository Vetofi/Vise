[package]
name = "vise-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Host a Vise server: server.toml, the CLI and the supervisor that runs the game headless (docs/server.md)"

[dependencies]
vise-server-files = { path = "../vise-server-files" }
vise-anticheat = { path = "../vise-anticheat" }
vise-bench = { path = "../vise-bench" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
vise-release-sign = { path = "../vise-release-sign" }
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[lints]
workspace = true
