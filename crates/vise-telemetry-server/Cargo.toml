[package]
name = "vise-telemetry-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
publish = false
description = "Receives opt-in data collection batches, keeps them compactly in SQLite and serves anonymous totals"

[workspace]

[dependencies]
vise-telemetry = { path = "../vise-telemetry", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.9"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
vise-telemetry = { path = "../vise-telemetry" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
